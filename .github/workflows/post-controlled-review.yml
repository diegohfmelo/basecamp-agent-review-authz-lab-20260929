name: Post controlled review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Controlled pull request number
        required: true
        type: string
      review_body:
        description: Exact bounded review instruction
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Submit COMMENT review as github-actions bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_BODY: ${{ inputs.review_body }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --raw-field event=COMMENT \
            --raw-field body="$REVIEW_BODY"
